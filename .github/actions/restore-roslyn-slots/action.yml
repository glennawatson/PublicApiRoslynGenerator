name: Restore Roslyn slots
description: Restore analyzer and code-fix projects for each Roslyn slot.
inputs:
  src-folder:
    description: Folder containing the solution.
    default: src
  projects:
    description: Newline-separated project paths relative to src-folder.
    default: |
      PublicApiSharp.Analyzers/PublicApiSharp.Analyzers.csproj
      PublicApiSharp.Analyzers.CodeFixes/PublicApiSharp.Analyzers.CodeFixes.csproj
  slots:
    description: Newline-separated RoslynVersion values.
    default: |
      roslyn4.8
      roslyn4.14
      roslyn5.3
      roslyn5.6
runs:
  using: composite
  steps:
  - name: Restore Roslyn package versions
    shell: bash
    env:
      SRC_FOLDER: ${{ inputs.src-folder }}
      PROJECTS: ${{ inputs.projects }}
      SLOTS: ${{ inputs.slots }}
    run: dotnet run --file "$GITHUB_ACTION_PATH/restore-roslyn-slots.cs"
