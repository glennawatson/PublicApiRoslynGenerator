name: SonarCloud

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

env:
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    MINVERVERSIONOVERRIDE: 0.0.0-sonar.0+${{ github.sha }}

jobs:
    analyze:
        name: Build, test, and analyze
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    fetch-tags: true

            -   name: Set up JDK 21
                uses: actions/setup-java@v5
                with:
                    java-version: '21'
                    distribution: temurin

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x

            -   name: Cache SonarCloud packages
                uses: actions/cache@v6
                with:
                    path: ~/.sonar/cache
                    key: ${{ runner.os }}-sonar
                    restore-keys: ${{ runner.os }}-sonar

            -   name: Cache SonarScanner
                id: cache-sonar-scanner
                uses: actions/cache@v6
                with:
                    path: ${{ runner.temp }}/sonar-scanner
                    key: ${{ runner.os }}-sonar-scanner
                    restore-keys: ${{ runner.os }}-sonar-scanner

            -   name: Install SonarScanner
                if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
                run: |
                    mkdir -p "${{ runner.temp }}/sonar-scanner"
                    dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/sonar-scanner"

            -   name: Restore
                working-directory: src
                run: |
                    # The analyzer and code fix are built once per Roslyn slot, and each slot is a
                    # separate project instance with its own obj/. Restoring the solution only
                    # covers the default slot, so restore each one explicitly.
                    dotnet restore PublicApiSharp.Analyzers.slnx
                    for slot in roslyn4.8 roslyn4.14 roslyn5.3 roslyn5.6; do
                      dotnet restore PublicApiSharp.Analyzers/PublicApiSharp.Analyzers.csproj -p:RoslynVersion=$slot
                      dotnet restore PublicApiSharp.Analyzers.CodeFixes/PublicApiSharp.Analyzers.CodeFixes.csproj -p:RoslynVersion=$slot
                    done

            -   name: Begin Sonar analysis
                working-directory: src
                env:
                    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                run: |
                    "${{ runner.temp }}/sonar-scanner/dotnet-sonarscanner" begin \
                      /k:"glennawatson_PublicApiRoslynGenerator" \
                      /o:"glennawatson" \
                      /d:sonar.token="${SONAR_TOKEN}" \
                      /d:sonar.host.url="https://sonarcloud.io" \
                      /d:sonar.scanner.skipJreProvisioning=true \
                      /d:sonar.cs.vscoveragexml.reportsPaths="**/TestResults/**/sonar-coverage.xml" \
                      /d:sonar.exclusions="**/tests/**,**/benchmarks/**" \
                      /d:sonar.coverage.exclusions="**/tests/**,**/benchmarks/**" \
                      /d:sonar.cpd.exclusions="**/tests/**,**/benchmarks/**" \
                      /d:sonar.test.exclusions="**/tests/**,**/benchmarks/**"

            -   name: Build
                working-directory: src
                run: dotnet build PublicApiSharp.Analyzers.slnx --no-restore --configuration Release

            # Run each package's tests into its own results directory. A single
            # --solution run points every project at the same --coverage-output file,
            # so the slower report overwrites the other and one package lands at 0%
            # in the coverage import. Distinct results directories keep both reports;
            # the shared sonar-coverage.xml name still matches the import glob below.
            -   name: Test Roslyn48 with MTP coverage
                working-directory: src
                run: dotnet test --project tests/PublicApiSharp.Analyzers.Tests.Roslyn48/PublicApiSharp.Analyzers.Tests.Roslyn48.csproj --configuration Release --no-build -- --coverage --coverage-output-format xml --results-directory TestResults/Roslyn48 --coverage-output sonar-coverage.xml

            -   name: Test Roslyn414 with MTP coverage
                working-directory: src
                run: dotnet test --project tests/PublicApiSharp.Analyzers.Tests.Roslyn414/PublicApiSharp.Analyzers.Tests.Roslyn414.csproj --configuration Release --no-build -- --coverage --coverage-output-format xml --results-directory TestResults/Roslyn414 --coverage-output sonar-coverage.xml

            -   name: Test Roslyn53 with MTP coverage
                working-directory: src
                run: dotnet test --project tests/PublicApiSharp.Analyzers.Tests.Roslyn53/PublicApiSharp.Analyzers.Tests.Roslyn53.csproj --configuration Release --no-build -- --coverage --coverage-output-format xml --results-directory TestResults/Roslyn53 --coverage-output sonar-coverage.xml

            -   name: Test Roslyn56 with MTP coverage
                working-directory: src
                run: dotnet test --project tests/PublicApiSharp.Analyzers.Tests.Roslyn56/PublicApiSharp.Analyzers.Tests.Roslyn56.csproj --configuration Release --no-build -- --coverage --coverage-output-format xml --results-directory TestResults/Roslyn56 --coverage-output sonar-coverage.xml

            -   name: End Sonar analysis
                working-directory: src
                env:
                    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                run: |
                    "${{ runner.temp }}/sonar-scanner/dotnet-sonarscanner" end \
                      /d:sonar.token="${SONAR_TOKEN}"
