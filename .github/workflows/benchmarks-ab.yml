name: Benchmarks A/B
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Baseline commit.'
        type: string
        required: true
      candidate:
        description: 'Commit compared against the baseline. Empty uses the latest commit on this branch.'
        type: string
        default: ''
      filter:
        description: 'BenchmarkDotNet filter globs, separated by spaces.'
        type: string
        default: '*'
      benchmarksPerSlice:
        description: 'Benchmarks per runner. 25 keeps a slice near 2.5 hours.'
        type: number
        default: 25
      warmupCount:
        description: 'Warmup iterations per benchmark.'
        type: number
        default: 6
      iterationCount:
        description: 'Measured iterations per benchmark.'
        type: number
        default: 15
permissions:
  contents: read
concurrency:
  group: benchmarks-ab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    name: Plan slices
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
      DOTNET_CLI_USE_MSBUILD_SERVER: 0
    outputs:
      slices: ${{ steps.plan.outputs.slices }}
      sliceSummary: ${{ steps.plan.outputs.sliceSummary }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@main
      with:
        stamp-version: 'false'
    - name: Checkout base
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.baseline }}
        path: ab/base
    - name: Checkout head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.candidate || github.sha }}
        path: ab/head
    - name: Split the matching benchmarks into slices
      id: plan
      env:
        FILTER: ${{ inputs.filter }}
        BENCHMARKS_PER_SLICE: ${{ inputs.benchmarksPerSlice }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@main
      with:
        shared-script: split-the-matching-benchmarks-into-slices-d1aaf19b50.cs
  benchmark:
    name: benchmark (${{ matrix.slice }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.slices) }}
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
      DOTNET_CLI_USE_MSBUILD_SERVER: 0
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@main
    - name: Checkout base
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.baseline }}
        path: ab/base
    - name: Checkout head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.candidate || github.sha }}
        path: ab/head
    - name: Run base and head in both orders
      env:
        PROJECT: ${{ matrix.project }}
        SLICE: ${{ matrix.slice }}
        BENCHMARKS: ${{ matrix.benchmarks }}
        WARMUP_COUNT: ${{ inputs.warmupCount }}
        ITERATION_COUNT: ${{ inputs.iterationCount }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@main
      with:
        shared-script: run-base-and-head-in-both-orders-16e34b4397.cs
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: benchmark-ab-${{ matrix.slice }}
        path: |
          ${{ runner.temp }}/benchmark-ab/**/*-report-full.json
          ${{ runner.temp }}/benchmark-ab/**/*-report-github.md
        if-no-files-found: ignore
  compare:
    name: Compare base and head
    needs: [plan, benchmark]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@main
      with:
        stamp-version: 'false'
    - name: Download slice results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: benchmark-ab-*
        path: ${{ runner.temp }}/benchmark-ab
        merge-multiple: true
    - name: Write the report
      env:
        BASELINE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate || github.sha }}
        FILTER: ${{ inputs.filter }}
        SLICES: ${{ needs.plan.outputs.sliceSummary }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@main
      with:
        shared-script: write-the-report-7a72ebae48.cs
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: benchmark-ab-report
        path: ${{ runner.temp }}/benchmark-ab-report.md
        if-no-files-found: ignore
