name: "CodeQL Advanced"

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    schedule:
        -   cron: '17 9 * * 2'

permissions: { }

env:
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
    analyze-csharp:
        name: Analyze C#
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            contents: read
            packages: read
            actions: read
        env:
            DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
            MINVERVERSIONOVERRIDE: 0.0.0-codeql.0+${{ github.sha }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    fetch-tags: true

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4.37.3
                with:
                    languages: csharp
                    build-mode: manual
                    queries: security-extended

            -   name: Restore
                working-directory: src
                run: |
                    # The analyzer and code fix are built once per Roslyn slot, and each slot is a
                    # separate project instance with its own obj/. Restoring the solution only
                    # covers the default slot, so restore each one explicitly.
                    dotnet restore PublicApiSharp.Analyzers.slnx
                    for slot in roslyn4.8 roslyn4.14 roslyn5.3 roslyn5.6; do
                      dotnet restore PublicApiSharp.Analyzers/PublicApiSharp.Analyzers.csproj -p:RoslynVersion=$slot
                      dotnet restore PublicApiSharp.Analyzers.CodeFixes/PublicApiSharp.Analyzers.CodeFixes.csproj -p:RoslynVersion=$slot
                    done

            -   name: Build
                working-directory: src
                run: dotnet build PublicApiSharp.Analyzers.slnx --no-restore --configuration Release

            -   name: Perform CodeQL analysis
                uses: github/codeql-action/analyze@v4.37.3
                with:
                    category: "/language:csharp"

    analyze-actions:
        name: Analyze GitHub Actions
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            contents: read
            actions: read

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4.37.3
                with:
                    languages: actions
                    queries: security-extended

            -   name: Perform CodeQL analysis
                uses: github/codeql-action/analyze@v4.37.3
                with:
                    category: "/language:actions"
