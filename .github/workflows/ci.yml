name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    uses: glennawatson/actions-common/.github/workflows/workflow-common-setup-and-build.yml@main
    with:
      runner: ${{ matrix.os }}
      solutionFile: PublicApiSharp.Analyzers.slnx
      minverTagPrefix: ''
      minverMinimumMajorMinor: '1.0'
      minverAutoIncrement: 'patch'
      dotnetVersions: |
        10.0.x
        11.0.x
      restoreRoslynSlots: true
