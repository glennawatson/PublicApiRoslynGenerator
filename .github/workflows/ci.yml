name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@main
      with:
        minver-tag-prefix: ''
        minver-minimum-major-minor: '1.0'
        minver-auto-increment: 'patch'
        dotnet-versions: |
          10.0.x
          11.0.x
    - name: Restore Roslyn slots
      uses: ./.github/actions/restore-roslyn-slots
    - name: Build
      uses: glennawatson/actions-common/.github/actions/dotnet-build@main
      with:
        solution-file: PublicApiSharp.Analyzers.slnx
        create-packages: 'false'
    - name: Test
      uses: glennawatson/actions-common/.github/actions/dotnet-test@main
      with:
        solution-file: PublicApiSharp.Analyzers.slnx
