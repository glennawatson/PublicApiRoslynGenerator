name: CI Build

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

env:
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ windows-latest, ubuntu-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        env:
            # MinVer is tag-first; on CI commits past the latest tag it would otherwise
            # walk git per project. Pin a deterministic CI version so every project
            # stamps the same value without the walk.
            MINVERVERSIONOVERRIDE: 0.0.0-ci.0+${{ github.sha }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    fetch-tags: true

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        10.0.x

            -   name: Restore
                working-directory: src
                shell: bash
                run: |
                    # The analyzer and code fix are built once per Roslyn slot, and each slot is a
                    # separate project instance with its own obj/. Restoring the solution only
                    # covers the default slot, so restore each one explicitly.
                    dotnet restore PublicApiSharp.Analyzers.slnx
                    for slot in roslyn4.8 roslyn4.14 roslyn5.3 roslyn5.6; do
                      dotnet restore PublicApiSharp.Analyzers/PublicApiSharp.Analyzers.csproj -p:RoslynVersion=$slot
                      dotnet restore PublicApiSharp.Analyzers.CodeFixes/PublicApiSharp.Analyzers.CodeFixes.csproj -p:RoslynVersion=$slot
                    done

            -   name: Build
                working-directory: src
                run: dotnet build PublicApiSharp.Analyzers.slnx --no-restore --configuration Release

            -   name: Test
                working-directory: src
                run: dotnet test --solution PublicApiSharp.Analyzers.slnx --no-build --configuration Release
